<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Árbol</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/arbolAnimado.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="h4 mb-3">Demo · montarArbol</h1>
    <div class="btn-group mb-3" role="group" aria-label="Datos de prueba">
      <button class="btn btn-outline-info" id="ejemplo">abracadabra</button>
      <button class="btn btn-outline-info" id="uno">Un solo carácter</button>
      <button class="btn btn-outline-info" id="vacio">Texto vacío</button>
    </div>
    <div id="arbol"></div>
  </main>

  <script type="module">
    import { montarArbol } from '../js/visualizador/arbolAnimado.js';
    const contenedor = document.getElementById('arbol');
    let instancia = null;   // se destruye la anterior para que su temporizador no siga dibujando

    function mostrar(pasos) {
      instancia?.destruir();
      instancia = montarArbol(contenedor, pasos, { msPorPaso: 600 });
    }

    async function mostrarEjemplo() {
      const respuesta = await fetch('../ejemplos/abracadabra-pasos.json');
      mostrar(await respuesta.json());
    }

    document.getElementById('ejemplo').onclick = mostrarEjemplo;
    // Caso borde del contrato: una sola hoja, cero fusiones.
    document.getElementById('uno').onclick = () =>
      mostrar([{ tipo: 'hoja', id: 0, simbolo: 'a', codePoint: 97, frecuencia: 4 }]);
    document.getElementById('vacio').onclick = () => mostrar([]);
    mostrarEjemplo();
  </script>
</body>
</html>
