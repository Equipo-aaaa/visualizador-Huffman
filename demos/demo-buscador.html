<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Buscador de libros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/buscador.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="h4 mb-1">Demo · montarBuscador</h1>
    <!-- Usa /api/buscar y /api/libro: se abre con `netlify dev` (localhost:8888), no con Live Server -->
    <p class="small text-secondary mb-3">Abrir con <code>netlify dev</code> en <code>localhost:8888/demos/demo-buscador.html</code>.</p>

    <div id="buscador"></div>

    <h2 class="h6 mt-4">Lo que recibe alElegirTexto</h2>
    <pre id="salida" class="small text-secondary">Todavía no eliges un libro.</pre>
  </main>

  <script type="module">
    import { montarBuscador } from '../js/gutenberg/buscador.js';

    const salida = document.getElementById('salida');

    // Hace lo mismo que hará pagina-principal.js, pero solo muestra lo que llegó
    montarBuscador(document.getElementById('buscador'), {
      alElegirTexto(texto, metadatos) {
        salida.textContent =
          `metadatos: ${JSON.stringify(metadatos, null, 2)}\n` +
          `caracteres: ${[...texto].length.toLocaleString('es-MX')}\n\n` +
          `inicio del texto:\n${texto.slice(0, 400)}…`;
      },
    });
  </script>
</body>
</html>
