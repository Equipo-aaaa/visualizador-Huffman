<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo · descompresion.js</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/descompresion.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="titulo-pagina mb-3">Demo de <span class="mono">montarDescompresion</span></h1>

  <div class="panel mb-3">
    <h2 class="titulo-panel">Cargar un archivo .hfmn</h2>
    <div id="cargar-hfmn"></div>
  </div>

  <div class="panel">
    <h2 class="titulo-panel">Lo que recibe la página</h2>
    <pre id="salida" class="mono small mb-0">Carga ejemplos/abracadabra.hfmn o el .hfmn que descargues en huffman.html.</pre>
  </div>

  <script type="module">
    import { montarDescompresion } from '../js/interfaz/descompresion.js';

    const salida = document.getElementById('salida');

    // Aquí no hay worker: solo se muestra qué bytes llegarían a la página
    const vista = montarDescompresion(document.getElementById('cargar-hfmn'), {
      alCargarHfmn(bytes, nombre) {
        const primeros = [...bytes.slice(0, 16)]
          .map((b) => b.toString(16).padStart(2, '0'))
          .join(' ');
        salida.textContent = `${nombre}\n${bytes.length.toLocaleString('es-MX')} bytes\nPrimeros 16: ${primeros}`;
        vista.mostrarEstado(`Listo: "${nombre}" se leyó bien.`);
      },
    });
  </script>
</body>
</html>
