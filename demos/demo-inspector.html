<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo · inspector.js</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/inspector.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="titulo-pagina mb-3">Demo de <span class="mono">montarInspector</span></h1>

  <div class="panel">
    <h2 class="titulo-panel">ejemplos/abracadabra.hfmn</h2>
    <div id="inspector"></div>
  </div>

  <script type="module">
    import { montarInspector } from '../js/interfaz/inspector.js';
    import { inspeccionar, descomprimir } from '../js/huffman/comprimirHuffman.js';

    // Aquí no hay worker: se inspecciona y se descomprime directamente.
    // abracadabra.hfmn no trae huella SHA-256, así que la integridad sale "no verificable".
    const bytes = new Uint8Array(await (await fetch('../ejemplos/abracadabra.hfmn')).arrayBuffer());
    const archivo = { nombre: 'abracadabra.hfmn', datos: inspeccionar(bytes), original: null };

    const vista = montarInspector(document.getElementById('inspector'), archivo, {
      alDescomprimir() {
        const resultado = descomprimir(bytes);
        resultado.integridad = { esperado: null, obtenido: null, coincideHash: null, identicoAlOriginal: null };
        vista.mostrarDescompresion(resultado);
      },
    });
  </script>
</body>
</html>
