<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Lector del .hfmn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/paginador.css" rel="stylesheet">
  <link href="../css/modulos/lectorHfmn.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="h4 mb-3">Demo · montarLectorHfmn</h1>
    <div id="lector-hfmn"></div>
  </main>

  <script type="module">
    import { montarLectorHfmn } from '../js/visualizador/lectorHfmn.js';

    // El JSON del ejemplo trae todo menos los bytes; esos están en abracadabra.hfmn.
    const resultado = await (await fetch('../ejemplos/abracadabra-resultado.json')).json();
    resultado.bytesHfmn = new Uint8Array(await (await fetch('../ejemplos/abracadabra.hfmn')).arrayBuffer());
    montarLectorHfmn(document.getElementById('lector-hfmn'), resultado);
  </script>
</body>
</html>
