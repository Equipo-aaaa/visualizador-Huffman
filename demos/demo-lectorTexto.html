<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Lector de texto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/paginador.css" rel="stylesheet">
  <link href="../css/modulos/lectorTexto.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="h4 mb-3">Demo · montarLectorTexto</h1>
    <div class="btn-group mb-3" role="group" aria-label="Datos de prueba">
      <button class="btn btn-outline-info" id="ejemplo">abracadabra</button>
      <button class="btn btn-outline-info" id="libro">Texto de 3 MB</button>
      <button class="btn btn-outline-info" id="emoji">Con emojis</button>
      <button class="btn btn-outline-info" id="vacio">Texto vacío</button>
    </div>
    <p id="medida" class="small text-secondary"></p>
    <div id="lector-texto"></div>
  </main>

  <script type="module">
    import { montarLectorTexto } from '../js/visualizador/lectorTexto.js';
    const contenedor = document.getElementById('lector-texto');
    const medida = document.getElementById('medida');

    function mostrar(texto) {
      const inicio = performance.now();
      montarLectorTexto(contenedor, texto);
      medida.textContent = `${texto.length.toLocaleString('es-MX')} caracteres · montado en ${(performance.now() - inicio).toFixed(1)} ms`;
    }

    // Texto de relleno de unos 3 MB 
    function crearLibroGrande() {
      const linea = 'En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo.\n';
      return linea.repeat(Math.ceil(3_000_000 / linea.length));
    }

    document.getElementById('ejemplo').onclick = async () => mostrar(await (await fetch('../ejemplos/abracadabra.txt')).text());
    document.getElementById('libro').onclick = () => mostrar(crearLibroGrande());
    // Cada emoji ocupa 2 posiciones en JavaScript
    document.getElementById('emoji').onclick = () => mostrar('😀'.repeat(10000));
    document.getElementById('vacio').onclick = () => mostrar('');
    document.getElementById('ejemplo').click();
  </script>
</body>
</html>
