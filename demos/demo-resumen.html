<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo · resumen.js</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="../css/modulos/resumen.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="titulo-pagina mb-3">Demo de <span class="mono">montarResumen</span></h1>

  <div class="panel mb-3">
    <h2 class="titulo-panel">abracadabra (texto corto: el .hfmn crece)</h2>
    <div id="resumen-abracadabra"></div>
  </div>

  <div class="panel">
    <h2 class="titulo-panel">Libro simulado (2 MB → 1.2 MB)</h2>
    <div id="resumen-libro"></div>
  </div>

  <script type="module">
    import { montarResumen } from '../js/interfaz/resumen.js';

    // abracadabra-resultado.json trae todo menos los bytes, que están en
    // abracadabra.hfmn: se juntan para armar un ResultadoHuffman completo.
    const [json, hfmn] = await Promise.all([
      fetch('../ejemplos/abracadabra-resultado.json').then((r) => r.json()),
      fetch('../ejemplos/abracadabra.hfmn').then((r) => r.arrayBuffer()),
    ]);
    json.bytesHfmn = new Uint8Array(hfmn);
    montarResumen(document.getElementById('resumen-abracadabra'), json);

    // Números parecidos a los del Quijote, para ver el caso con ahorro.
    // Los bytes son de relleno: el archivo descargado no es un .hfmn válido.
    const original = 2_225_777;
    const tamHfmn = 1_213_400;
    montarResumen(document.getElementById('resumen-libro'), {
      metadatos: { titulo: 'Don Quijote: "edición" de prueba', origen: 'gutenberg' },
      // 111 símbolos distintos, como el Quijote real
      frecuencias: Array.from({ length: 111 }, () => ({ frecuencia: 0 })),
      totalCaracteres: 2_168_090,
      bytesHfmn: new Uint8Array(tamHfmn),
      tamanos: {
        original,
        datos: 1_212_541,
        hfmn: tamHfmn,
        razon: tamHfmn / original,
        ahorro: 1 - tamHfmn / original,
      },
    });
  </script>
</body>
</html>
